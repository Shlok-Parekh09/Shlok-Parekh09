<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 196" width="830" height="196" role="img" aria-label="Push activity for the 0 most recently active repositories over the last 14 days. .">
<title>ACTIVE OPS // flight recorder</title>
<defs>
<linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4f86ff"/><stop offset="50%" stop-color="#f2f7ff"/><stop offset="100%" stop-color="#ffc233"/></linearGradient>
<linearGradient id="auroraV" x1="0" y1="1" x2="0" y2="0"><stop offset="0%" stop-color="#4f86ff"/><stop offset="50%" stop-color="#f2f7ff"/><stop offset="100%" stop-color="#ffc233"/></linearGradient>
<linearGradient id="bdr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f86ff" stop-opacity=".6"/><stop offset=".5" stop-color="#8fc7ff" stop-opacity=".3"/><stop offset="1" stop-color="#ffc233" stop-opacity=".6"/></linearGradient>
<filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
text{font-family:system-ui,-apple-system,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.label{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;fill:#8b9dca}
</style><clipPath id="card"><rect width="830" height="196" rx="16"/></clipPath></defs>
<g clip-path="url(#card)">
<rect width="830" height="196" rx="16" fill="#08112b"/><circle cx="28" cy="30" r="3.5" fill="#34d399"><animate attributeName="opacity" values="1;.25;1" dur="2.4s" repeatCount="indefinite"/></circle><text x="40" y="34" class="label" style="fill:#b4c4e8">FLIGHT RECORDER</text><text x="802" y="34" class="label" text-anchor="end">last 14 days &#183; 0 pushes &#183; 6h bins</text><line x1="28" y1="48" x2="802" y2="48" stroke="#243566"/>
<text x="415.0" y="98.0" font-size="14" fill="#b4c4e8" text-anchor="middle">No pushes in the last 14 days. The recorder fills as soon as I ship.</text>
</g>
<rect x=".5" y=".5" width="829" height="195" rx="16" fill="none" stroke="url(#bdr)" stroke-width="1.2"/>
</svg>